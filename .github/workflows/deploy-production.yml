name: Publish production images

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image namespace
        run: echo "IMAGE_PREFIX=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_PREFIX }}/api:production

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:production
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}

      - name: Hosting provider deployment placeholder
        run: echo "::notice title=Hosting provider not configured::Images were published to GHCR. Configure the production environment and replace this placeholder with the selected provider's deployment action."
