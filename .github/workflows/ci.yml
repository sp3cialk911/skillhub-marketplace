name: Quality checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=client

      - name: Lint backend
        run: npm run lint --workspace=server

      - name: Test frontend
        run: npm test --workspace=client -- --passWithNoTests

      - name: Test backend
        run: npm test --workspace=server -- --passWithNoTests

      - name: Build frontend
        run: npm run build --workspace=client

      - name: Verify frontend artifact
        run: test -s client/dist/index.html

      - name: Build backend
        run: npm run build --workspace=server

      - name: Smoke-test API health endpoint
        shell: bash
        run: |
          node server/src/server.js > /tmp/skillhub-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/skillhub-api.log
          exit 1

  docker:
    name: Validate Compose and Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build application images
        run: docker compose -f compose.yaml build
